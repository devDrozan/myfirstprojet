<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Dashboard</title>
  </head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <nav class="col-2 bg-light pe-3">
          <h1 class="h4 py-3 text-center text-primary">
            <i class="fas fa-code me-2"></i>
            <span class="d-none d-lg-inline">RozanDev</span>
          </h1>
          <div class="list-group text-center text-lg-start">
            <span class="list-group-item disabled d-none d-lg-block">
              <small>Control</small>
            </span>
            <a class="list-group-item list-group-item-action active" href="#">
              <i class="fas fa-home"></i
              ><span class="d-none d-lg-inline">Dashboard</span>
            </a>
            <a class="list-group-item list-group-item-action" href="#">
              <i class="fas fa-users"></i>
              <span class="d-none d-lg-inline">Users</span>
              <span
                class="badge bg-danger d-none d-lg-inline rounded-pill float-end"
                >30</span
              >
            </a>
            <a class="list-group-item list-group-item-action" href="#">
              <i class="fas fa-chart-line"></i>
              <span class="d-none d-lg-inline">Statistics</span>
            </a>
            <a class="list-group-item list-group-action" href="#">
              <i class="fas fa-flag"></i>
              <span class="d-none d-lg-inline">Reports</span>
            </a>
          </div>
          <div class="list-group text-center text-lg-start">
            <span class="list-group-item disable d-none d-lg-inline"
              >Actions</span
            >
            <a class="list-group-item list-group-item-action" href="#">
              <i class="fas fa-user"></i>
              <span class="d-none d-lg-inline">New User</span>
            </a>
            <a class="list-group-item list-group-item-action" href="#">
              <i class="fas fa-edit"></i>
              <span class="d-none d-lg-inline">Update data</span> </a
            ><a class="list-group-item list-group-item-action" href="#">
              <i class="fas fa-calendar-alt"></i>
              <span class="d-none d-lg-inline">Add Events</span>
            </a>
          </div>
        </nav>
        <main class="col-10 bg-secondary">
          <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="flex-fill"></div>
            <ul class="navbar-nav">
              <li class="nav-item dropdown">
                <a
                  href="#"
                  class="nav-link dropdown-toggle"
                  data-bs-toggle="dropdown"
                >
                  <i class="fas fa-user-circle"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a href="#" class="dropdown-item">User Profile</a></li>
                  <li><a href="#" class="dropdown-item">Logout</a></li>
                </ul>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link"><i class="fas fa-cog"></i></a>
              </li>
            </ul>
          </nav>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
